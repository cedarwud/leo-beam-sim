r5_goal: >-
  Build one deterministic seven-beam instructor scenario on the R4 projection
  boundary: Intra then Inter on one source-time axis, with direct Inter entry,
  reset, pause, replay, seek, speed invariance, and cross-surface telemetry.

r5_results:
  scenario_id: homepage-seven-beam-intra-inter-v1
  scenario_version: 1
  public_modules:
    - src/homepage/teaching/instructorHandoverScenario.ts
    - src/homepage/teaching/instructorHandoverTransport.ts
    - src/homepage/teaching/useInstructorHandoverTransport.ts
    - src/homepage/teaching/instructorHandoverTelemetry.ts
  source_time_axis_sec: 144
  segments:
    - kind: intra
      start_sec: 0
      end_sec: 72
    - kind: inter
      start_sec: 72
      end_sec: 144
  direct_inter_window_sec: 72_to_144
  required_beam_topology:
    serving_beam_count: 7
    candidate_beam_count: 7
    admission: fail_closed
  speed_presets:
    - 1
    - 2
    - 5
    - 10
    - 20
  controls:
    - play_pause
    - restart
    - reversible_seek
    - speed
    - close
  production_surfaces:
    - root
    - scene
    - rail
    - caption
    - teaching_cones
  invariants:
    - one_pure_source_time_transport
    - same_source_time_same_story_across_speed_and_replay
    - live_scientific_producer_frozen_during_authored_run
    - live_pause_and_speed_restored_on_close
    - fixture_latched_per_run_and_segment
    - no_teaching_manual_wall_clock_interlude
    - no_renderer_local_endpoint_phase_or_winner_inference
  defect_caught_during_execution: >-
    The first draft still armed the older manual handover presentation at the
    authored switching beat. That would have introduced a second transition
    clock and endpoint authority. The teaching-only trigger was removed; the
    existing non-teaching manual Intra fallback remains unchanged.

